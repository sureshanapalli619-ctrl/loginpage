spring.application.name=reglogBackend

# Database - configured with environment variables and local fallbacks
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/reglog_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Suresh@111}

# HikariCP pool optimization for Render 512MB RAM and cloud DB connection limits
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server - Dynamic port injected by Render ($PORT) with fallback to 8080
server.port=${PORT:8080}

# JWT
jwt.secret=${JWT_SECRET:reglogBackendSecretKeyForJwtAuthentication2026VerySecure}
jwt.expiration=86400000